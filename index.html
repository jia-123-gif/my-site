  <!-- 待办区域 -->
  <div class="todo-box" id="todo">
    <h2>我的待办清单</h2>
    <div class="input-wrap">
      <input id="taskInput" placeholder="输入任务">
      <button id="addBtn">添加</button>
    </div>
    <ul id="list"></ul>
  </div>

  <!-- 留言表单 -->
  <div class="form-box" id="message">
    <h4>给我留一条消息</h4>
    <form id="msgForm">
      <input type="text" placeholder="你的昵称" required>
      <input type="email" placeholder="你的邮箱" required>
      <input type="text" placeholder="留言内容" required>
      <button type="submit">发送留言</button>
    </form>
  </div>
